cache_dir: data/cache

# for eval
fsd50k_dir: path/to/fsd50k

# path where the hdf5 is created / where it is loaded from
mel_fn: data/fsd50k-train-16khz-64mel-20ms-3.0-1.5.hdf

# training audio
audio_data_dirs:
  - path/to/fsd50k/FSD50K.dev_audio

# feature settings
sample_rate: 16000
n_fft: 512
hop_length: 320
n_mels: 64
f_min: 50

# data preparation (mel frames)
segment_length: 150
segment_hop: 75
min_segment_length: 50

# for reading audio
min_length: 0.2
#max_length: 10.0

# it is possible to take a shorter segment during the training
#train_segment_length: 100 

# byol-a like 
# train_segment_length: 128

models_dir: data/ckpt-resnet-10x1000-200/
eval_model: data/ckpt-resnet-10x1000-200/model-200.pt
save_every: 10
log_dir: data/logs

batch_size: 512
num_dataloader_workers: 20
n_epochs: 200
weight_decay: 1.0e-5
clip_grad_norm: 10.0
mixup_alpha: 0.3
log_interval: 100

#learning_rate: 0.05
learning_rate: 0.01
#scheduler_gamma: 0.95
scheduler_gamma: 0.98
scheduler_step_size: 5

# sinkhorn-knopp params. number of splits is better to keep at 1
n_optimization_splits: 1
sk_lambda: 25.0

# augmentations
n_time_mask: 2
n_freq_mask: 2
time_mask_param: 32
freq_mask_param: 16

# these are for the dataset, but actually the similar things are incorporated in the model 
#noise_sigma: 0.02
#random_stretch_range: 0.1

#data_norm_params:
#  mean: -5.9312963
#  std: 5.3587365

model:
  dropout: 0.2
  n_heads: 10
  n_classes_per_head: 1000

